name: Release Android APK

on:
  push:
    branches:
      - agent/release-mac-android-site-1.5.6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CHURCHDAW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      CHURCHDAW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      CHURCHDAW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Android SDK e NDK exigidos pelo JUCE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse `
            -Filter sdkmanager.bat | Select-Object -First 1
          if ($null -eq $sdkManager) {
            throw 'sdkmanager.bat nao foi encontrado no runner'
          }
          & $sdkManager.FullName `
            'platforms;android-36' `
            'build-tools;36.0.0' `
            'ndk;28.1.13356709'
          if ($LASTEXITCODE -ne 0) {
            throw "sdkmanager terminou com codigo $LASTEXITCODE"
          }

      - name: Restaurar chave oficial de assinatura
        shell: pwsh
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'ANDROID_UPLOAD_KEYSTORE_BASE64',
            'CHURCHDAW_UPLOAD_STORE_PASSWORD',
            'CHURCHDAW_UPLOAD_KEY_ALIAS',
            'CHURCHDAW_UPLOAD_KEY_PASSWORD'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Secret obrigatorio ausente: $name"
            }
          }
          $bytes = [Convert]::FromBase64String($env:ANDROID_UPLOAD_KEYSTORE_BASE64)
          if ($bytes.Length -lt 1024) {
            throw 'Keystore decodificado e pequeno demais'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'churchdaw-upload.jks'
          [IO.File]::WriteAllBytes($keystore, $bytes)
          "CHURCHDAW_UPLOAD_STORE_FILE=$keystore" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Regenerar projeto Android e sincronizar recursos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\JUCE\Projucer.exe --resave .\ChurchDAW.jucer
          if ($LASTEXITCODE -ne 0) {
            throw "Projucer terminou com codigo $LASTEXITCODE"
          }

          $source = (Resolve-Path .\Packaging\AndroidResources).Path
          $target = Join-Path $PWD 'Builds\Android\app\src\main\res'
          Get-ChildItem -LiteralPath $source -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($source.Length).TrimStart('\', '/')
            $destination = Join-Path $target $relative
            New-Item -ItemType Directory -Force `
              -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
          }

          $escapedSdk = $env:ANDROID_HOME.Replace('\', '\\').Replace(':', '\:')
          Set-Content -LiteralPath .\Builds\Android\local.properties `
            -Value "sdk.dir=$escapedSdk" -Encoding Ascii

      - name: Auditar configuracao Android
        shell: pwsh
        run: |
          .\Packaging\AssertAndroidBuildConfiguration.ps1 -ProjectRoot $PWD
          if ($LASTEXITCODE -ne 0) {
            throw "Auditoria Android terminou com codigo $LASTEXITCODE"
          }

      - name: Compilar e assinar APK Release arm64
        shell: pwsh
        working-directory: Builds/Android
        run: |
          .\gradlew.bat clean lintRelease_Release assembleRelease_Release `
            --no-daemon --max-workers=1 --console=plain --stacktrace
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle terminou com codigo $LASTEXITCODE"
          }

      - name: Verificar assinatura, pacote, versao e ABI
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          [xml] $project = Get-Content .\ChurchDAW.jucer -Raw
          $versionName = [string] $project.JUCERPROJECT.version
          $android = $project.JUCERPROJECT.EXPORTFORMATS.ANDROIDSTUDIO
          $versionCode = [string] $android.androidVersionCode
          if ($versionName -notmatch '^\d+\.\d+\.\d+$' -or
              $versionCode -notmatch '^[1-9]\d*$') {
            throw 'Versao Android invalida no ChurchDAW.jucer'
          }

          $builtApk = Resolve-Path `
            '.\Builds\Android\app\build\outputs\apk\release_\release\app-release_-release.apk'
          New-Item -ItemType Directory -Force .\dist | Out-Null
          $publicApk = Join-Path $PWD "dist\ChurchDAW-$versionName.apk"
          Copy-Item -LiteralPath $builtApk -Destination $publicApk -Force

          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory |
            Sort-Object { try { [version] $_.Name } catch { [version] '0.0' } } -Descending |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'apksigner.bat')) -and
              (Test-Path (Join-Path $_.FullName 'aapt.exe'))
            } | Select-Object -First 1
          if ($null -eq $buildTools) {
            throw 'apksigner/aapt nao encontrados no Android SDK'
          }

          $signerOutput = @(& (Join-Path $buildTools.FullName 'apksigner.bat') `
            verify --verbose --print-certs $publicApk)
          if ($LASTEXITCODE -ne 0 -or
              -not ($signerOutput -match 'Verified using v2 scheme \(APK Signature Scheme v2\): true')) {
            $signerOutput | ForEach-Object { Write-Host $_ }
            throw 'APK sem assinatura v2 valida'
          }

          $badging = @(& (Join-Path $buildTools.FullName 'aapt.exe') `
            dump badging $publicApk)
          if ($LASTEXITCODE -ne 0) {
            throw 'aapt dump badging falhou'
          }
          $packageLine = $badging | Where-Object { $_ -like 'package:*' } |
            Select-Object -First 1
          if ($packageLine -notmatch "name='com\.churchdaw\.app'" -or
              $packageLine -notmatch "versionCode='$([regex]::Escape($versionCode))'" -or
              $packageLine -notmatch "versionName='$([regex]::Escape($versionName))'") {
            throw "Metadados inesperados no APK: $packageLine"
          }

          $zip = [IO.Compression.ZipFile]::OpenRead($publicApk)
          try {
            $abis = @($zip.Entries | ForEach-Object {
              if ($_.FullName -match '^lib/([^/]+)/') { $Matches[1] }
            } | Sort-Object -Unique)
          }
          finally {
            $zip.Dispose()
          }
          if ($abis.Count -ne 1 -or $abis[0] -cne 'arm64-v8a') {
            throw "ABIs inesperadas no APK: $($abis -join ', ')"
          }

          $item = Get-Item -LiteralPath $publicApk
          $sha256 = (Get-FileHash -LiteralPath $publicApk -Algorithm SHA256).Hash
          $certLine = $signerOutput | Where-Object {
            $_ -like 'Signer #1 certificate SHA-256 digest:*'
          } | Select-Object -First 1
          $certSha256 = if ($certLine) { ($certLine -split ':', 2)[1].Trim() } else { '' }

          [ordered]@{
            package_id = 'com.churchdaw.app'
            version_name = $versionName
            version_code = [int] $versionCode
            abi = 'arm64-v8a'
            bytes = $item.Length
            sha256 = $sha256
            signing_certificate_sha256 = $certSha256
            source_commit = '${{ github.sha }}'
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\dist\android-release-metadata.json -Encoding UTF8

          $signerOutput | ForEach-Object { Write-Host $_ }
          Write-Host $packageLine
          Write-Host "ABI: arm64-v8a"
          Write-Host "APK: $publicApk"
          Write-Host "Bytes: $($item.Length)"
          Write-Host "SHA-256: $sha256"
          "version=$versionName" >> $env:GITHUB_OUTPUT

      - name: Publicar APK Release assinado
        uses: actions/upload-artifact@v4
        with:
          name: ChurchDAW-Android-${{ steps.metadata.outputs.version }}-Release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatorio do lint em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChurchDAW-Android-lint-failure
          path: Builds/Android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
