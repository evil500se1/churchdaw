name: Release Android APK

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: churchdaw-android-production-release
  cancel-in-progress: false

jobs:
  build-android-release:
    runs-on: windows-2022
    timeout-minutes: 90
    environment: android-production
    env:
      GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8

    steps:
      - name: Validar tag de release antes de credenciais
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = [string] $env:GITHUB_REF
          $refType = [string] $env:GITHUB_REF_TYPE
          $refName = [string] $env:GITHUB_REF_NAME
          $commit = [string] $env:GITHUB_SHA
          $eventName = [string] $env:GITHUB_EVENT_NAME

          $match = [regex]::Match(
            $ref,
            '^refs/tags/(?<tag>v[0-9]+\.[0-9]+\.[0-9]+)$',
            [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )
          if (-not $match.Success -or $refType -cne 'tag') {
            throw "Release Android aceita somente refs/tags/vX.Y.Z; recebido: $ref"
          }

          $tag = $match.Groups['tag'].Value
          if ($refName -cne $tag) {
            throw "GITHUB_REF_NAME nao corresponde a tag validada: $refName"
          }
          if ($commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'GITHUB_SHA ausente ou invalido'
          }
          if ($eventName -cnotin @('push', 'workflow_dispatch')) {
            throw "Evento de release nao autorizado: $eventName"
          }

          "CHURCHDAW_RELEASE_TAG=$tag" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Baixar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Provar tag e commit no main remoto
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = [string] $env:CHURCHDAW_RELEASE_TAG
          $tagRef = "refs/tags/$tag"
          $triggerObject = ([string] $env:GITHUB_SHA).ToUpperInvariant()

          $remoteRows = @(git ls-remote --exit-code --refs origin $tagRef)
          $remoteExit = $LASTEXITCODE
          if ($remoteExit -ne 0 -or $remoteRows.Count -ne 1) {
            throw "Tag remota unica nao encontrada: $tagRef"
          }
          $remoteMatch = [regex]::Match(
            [string] $remoteRows[0],
            "^(?<sha>[0-9a-fA-F]{40})\s+$([regex]::Escape($tagRef))$",
            [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )
          if (-not $remoteMatch.Success) {
            throw "Resposta remota invalida para $tagRef"
          }
          $remoteTagObject = $remoteMatch.Groups['sha'].Value.ToUpperInvariant()

          git fetch --force --no-tags origin `
            '+refs/heads/main:refs/remotes/origin/main' `
            "+${tagRef}:${tagRef}"
          if ($LASTEXITCODE -ne 0) {
            throw 'Falha ao buscar main e tag de release no origin'
          }

          $headCommit = [string] (git rev-parse --verify 'HEAD^{commit}')
          if ($LASTEXITCODE -ne 0) { throw 'HEAD nao resolve para um commit' }
          $headCommit = $headCommit.Trim().ToUpperInvariant()

          $triggerCommit = [string] (
            git rev-parse --verify "${triggerObject}^{commit}"
          )
          if ($LASTEXITCODE -ne 0) {
            throw 'GITHUB_SHA nao resolve para um commit'
          }
          $triggerCommit = $triggerCommit.Trim().ToUpperInvariant()

          $tagObject = [string] (git rev-parse --verify $tagRef)
          if ($LASTEXITCODE -ne 0) { throw 'Tag local nao pode ser resolvida' }
          $tagObject = $tagObject.Trim().ToUpperInvariant()

          $tagCommit = [string] (git rev-parse --verify "${tagRef}^{commit}")
          if ($LASTEXITCODE -ne 0) { throw 'Tag nao aponta para um commit' }
          $tagCommit = $tagCommit.Trim().ToUpperInvariant()

          if ($headCommit -cne $triggerCommit -or $tagCommit -cne $triggerCommit) {
            throw "Tag/HEAD nao correspondem ao commit de GITHUB_SHA $triggerObject"
          }
          if ($tagObject -cne $remoteTagObject) {
            throw 'Objeto da tag local difere da tag publicada no origin'
          }

          git merge-base --is-ancestor $tagCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Commit da tag nao pertence ao historico aprovado de origin/main'
          }

          "CHURCHDAW_REMOTE_TAG_OBJECT_SHA=$remoteTagObject" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CHURCHDAW_RELEASE_COMMIT=$triggerCommit" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configurar Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Instalar Android SDK e NDK exigidos pelo JUCE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse `
            -Filter sdkmanager.bat | Select-Object -First 1
          if ($null -eq $sdkManager) {
            throw 'sdkmanager.bat nao foi encontrado no runner'
          }
          & $sdkManager.FullName `
            'platforms;android-36' `
            'build-tools;36.0.0' `
            'ndk;28.1.13356709'
          if ($LASTEXITCODE -ne 0) {
            throw "sdkmanager terminou com codigo $LASTEXITCODE"
          }

      - name: Restaurar chave oficial de assinatura
        shell: pwsh
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_UPLOAD_KEYSTORE_BASE64)) {
            throw 'Secret obrigatorio ausente: ANDROID_UPLOAD_KEYSTORE_BASE64'
          }
          $bytes = [Convert]::FromBase64String($env:ANDROID_UPLOAD_KEYSTORE_BASE64)
          if ($bytes.Length -lt 1024) {
            throw 'Keystore decodificado e pequeno demais'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'churchdaw-upload.jks'
          [IO.File]::WriteAllBytes($keystore, $bytes)
          "CHURCHDAW_UPLOAD_STORE_FILE=$keystore" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Regenerar projeto Android e sincronizar recursos
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projucer = Start-Process -FilePath .\JUCE\Projucer.exe `
            -ArgumentList @('--resave', (Resolve-Path .\ChurchDAW.jucer).Path) `
            -WindowStyle Hidden -Wait -PassThru
          if ($projucer.ExitCode -ne 0) {
            throw "Projucer terminou com codigo $($projucer.ExitCode)"
          }

          $source = (Resolve-Path .\Packaging\AndroidResources).Path
          $target = Join-Path $PWD 'Builds\Android\app\src\main\res'
          Get-ChildItem -LiteralPath $source -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($source.Length).TrimStart('\', '/')
            $destination = Join-Path $target $relative
            New-Item -ItemType Directory -Force `
              -Path (Split-Path -Parent $destination) | Out-Null
            Copy-Item -LiteralPath $_.FullName -Destination $destination -Force
          }

          $escapedSdk = $env:ANDROID_HOME.Replace('\', '\\').Replace(':', '\:')
          Set-Content -LiteralPath .\Builds\Android\local.properties `
            -Value "sdk.dir=$escapedSdk" -Encoding Ascii

      - name: Auditar configuracao Android
        shell: pwsh
        run: |
          .\Packaging\AssertAndroidBuildConfiguration.ps1 -ProjectRoot $PWD
          if ($LASTEXITCODE -ne 0) {
            throw "Auditoria Android terminou com codigo $LASTEXITCODE"
          }

      - name: Compilar e assinar APK Release arm64
        shell: pwsh
        working-directory: Builds/Android
        env:
          CHURCHDAW_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CHURCHDAW_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CHURCHDAW_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'CHURCHDAW_UPLOAD_STORE_FILE',
            'CHURCHDAW_UPLOAD_STORE_PASSWORD',
            'CHURCHDAW_UPLOAD_KEY_ALIAS',
            'CHURCHDAW_UPLOAD_KEY_PASSWORD'
          )) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name))) {
              throw "Credencial Android obrigatoria ausente: $name"
            }
          }
          .\gradlew.bat clean lintRelease_Release assembleRelease_Release `
            --no-daemon --max-workers=1 --console=plain --stacktrace
          if ($LASTEXITCODE -ne 0) {
            throw "Gradle terminou com codigo $LASTEXITCODE"
          }

      - name: Verificar assinatura, pacote, versao e ABI
        id: metadata
        shell: pwsh
        env:
          CHURCHDAW_EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_EXPECTED_CERTIFICATE_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          [xml] $project = Get-Content .\ChurchDAW.jucer -Raw
          $versionName = [string] $project.JUCERPROJECT.version
          $android = $project.JUCERPROJECT.EXPORTFORMATS.ANDROIDSTUDIO
          $versionCode = [string] $android.androidVersionCode
          if ($versionName -notmatch '^\d+\.\d+\.\d+$' -or
              $versionCode -notmatch '^[1-9]\d*$') {
            throw 'Versao Android invalida no ChurchDAW.jucer'
          }

          $builtApk = Resolve-Path `
            '.\Builds\Android\app\build\outputs\apk\release_\release\app-release_-release.apk'
          New-Item -ItemType Directory -Force .\dist | Out-Null
          # A ponte de atualizacao aceita somente o nome oficial terminado em
          # -signed.apk. Publicar outro nome gera um APK valido que o proprio
          # aplicativo se recusa a instalar.
          $publicApk = Join-Path $PWD "dist\ChurchDAW-$versionName-signed.apk"
          Copy-Item -LiteralPath $builtApk -Destination $publicApk -Force

          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory |
            Sort-Object { try { [version] $_.Name } catch { [version] '0.0' } } -Descending |
            Where-Object {
              (Test-Path (Join-Path $_.FullName 'apksigner.bat')) -and
              (Test-Path (Join-Path $_.FullName 'aapt.exe'))
            } | Select-Object -First 1
          if ($null -eq $buildTools) {
            throw 'apksigner/aapt nao encontrados no Android SDK'
          }

          $signerOutput = @(& (Join-Path $buildTools.FullName 'apksigner.bat') `
            verify --verbose --print-certs $publicApk)
          if ($LASTEXITCODE -ne 0 -or
              -not ($signerOutput -match 'Verified using v2 scheme \(APK Signature Scheme v2\): true')) {
            $signerOutput | ForEach-Object { Write-Host $_ }
            throw 'APK sem assinatura v2 valida'
          }

          $badging = @(& (Join-Path $buildTools.FullName 'aapt.exe') `
            dump badging $publicApk)
          if ($LASTEXITCODE -ne 0) {
            throw 'aapt dump badging falhou'
          }
          $packageLine = $badging | Where-Object { $_ -like 'package:*' } |
            Select-Object -First 1
          if ($packageLine -notmatch "name='com\.churchdaw\.app'" -or
              $packageLine -notmatch "versionCode='$([regex]::Escape($versionCode))'" -or
              $packageLine -notmatch "versionName='$([regex]::Escape($versionName))'") {
            throw "Metadados inesperados no APK: $packageLine"
          }

          $zip = [IO.Compression.ZipFile]::OpenRead($publicApk)
          try {
            $abis = @($zip.Entries | ForEach-Object {
              if ($_.FullName -match '^lib/([^/]+)/') { $Matches[1] }
            } | Sort-Object -Unique)
          }
          finally {
            $zip.Dispose()
          }
          if ($abis.Count -ne 1 -or $abis[0] -cne 'arm64-v8a') {
            throw "ABIs inesperadas no APK: $($abis -join ', ')"
          }

          $item = Get-Item -LiteralPath $publicApk
          $sha256 = (Get-FileHash -LiteralPath $publicApk -Algorithm SHA256).Hash
          $certLine = $signerOutput | Where-Object {
            $_ -match '(?:Signer #\d+|V2 Signer): certificate SHA-256 digest:'
          } | Select-Object -First 1
          if (-not $certLine -or
              $certLine -notmatch 'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})') {
            throw 'SHA-256 do certificado de assinatura nao encontrado'
          }
          $certSha256 = $Matches[1].ToUpperInvariant()

          $expectedCertSha256 =
            ($env:CHURCHDAW_EXPECTED_SIGNING_CERT_SHA256 -replace '\s', '').ToUpperInvariant()
          if ($expectedCertSha256 -notmatch '^[0-9A-F]{64}$') {
            throw 'ANDROID_EXPECTED_CERTIFICATE_SHA256 ausente ou invalido'
          }
          if ($certSha256 -cne $expectedCertSha256) {
            throw "Certificado APK inesperado: $certSha256"
          }

          if ($env:CHURCHDAW_RELEASE_TAG -cne "v$versionName") {
            throw "Tag $env:CHURCHDAW_RELEASE_TAG difere da versao Android v$versionName"
          }

          [ordered]@{
            package_id = 'com.churchdaw.app'
            version_name = $versionName
            version_code = [int] $versionCode
            abi = 'arm64-v8a'
            bytes = $item.Length
            sha256 = $sha256
            signing_certificate_sha256 = $certSha256
            source_commit = ([string] $env:CHURCHDAW_RELEASE_COMMIT).ToLowerInvariant()
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\dist\android-release-metadata.json -Encoding UTF8

          $signerOutput | ForEach-Object { Write-Host $_ }
          Write-Host $packageLine
          Write-Host "ABI: arm64-v8a"
          Write-Host "APK: $publicApk"
          Write-Host "Bytes: $($item.Length)"
          Write-Host "SHA-256: $sha256"
          "version=$versionName" >> $env:GITHUB_OUTPUT

      - name: Revalidar tag remota antes da publicacao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = [string] $env:CHURCHDAW_RELEASE_TAG
          $tagRef = "refs/tags/$tag"
          $expectedCommit =
            ([string] $env:CHURCHDAW_RELEASE_COMMIT).ToUpperInvariant()
          $expectedTagObject =
            ([string] $env:CHURCHDAW_REMOTE_TAG_OBJECT_SHA).ToUpperInvariant()

          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or
              $expectedCommit -notmatch '^[0-9A-F]{40}$' -or
              $expectedTagObject -notmatch '^[0-9A-F]{40}$') {
            throw 'Contexto validado da tag foi perdido ou alterado'
          }

          $remoteRows = @(git ls-remote --exit-code --refs origin $tagRef)
          $remoteExit = $LASTEXITCODE
          if ($remoteExit -ne 0 -or $remoteRows.Count -ne 1) {
            throw "Tag remota unica nao encontrada antes do upload: $tagRef"
          }
          $remoteMatch = [regex]::Match(
            [string] $remoteRows[0],
            "^(?<sha>[0-9a-fA-F]{40})\s+$([regex]::Escape($tagRef))$",
            [Text.RegularExpressions.RegexOptions]::CultureInvariant
          )
          if (-not $remoteMatch.Success -or
              $remoteMatch.Groups['sha'].Value.ToUpperInvariant() -cne
                $expectedTagObject) {
            throw 'Tag remota foi removida ou alterada durante o build'
          }

          git fetch --force --no-tags origin `
            '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw 'Falha ao revalidar origin/main antes do upload'
          }

          $headCommit = [string] (git rev-parse --verify 'HEAD^{commit}')
          if ($LASTEXITCODE -ne 0) { throw 'HEAD nao resolve para um commit' }
          $tagCommit = [string] (git rev-parse --verify "${tagRef}^{commit}")
          if ($LASTEXITCODE -ne 0) { throw 'Tag local nao aponta para um commit' }
          if ($headCommit.Trim().ToUpperInvariant() -cne $expectedCommit -or
              $tagCommit.Trim().ToUpperInvariant() -cne $expectedCommit) {
            throw 'HEAD/tag local mudaram durante o build'
          }

          git merge-base --is-ancestor $expectedCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Commit da tag deixou de pertencer a origin/main antes do upload'
          }

      - name: Publicar APK Release assinado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChurchDAW-Android-${{ steps.metadata.outputs.version }}-Release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar relatorio do lint em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChurchDAW-Android-lint-failure
          path: Builds/Android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
