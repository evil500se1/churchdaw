name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build-mac --config Release --parallel 3

      - name: Auditar pacote universal do macOS
        run: |
          APP=build-mac/MinhaDAW_artefacts/Release/ChurchDAW.app
          EXE="$APP/Contents/MacOS/ChurchDAW"
          PLIST="$APP/Contents/Info.plist"
          plutil -lint "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.churchdaw.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "1.1.0"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$PLIST" | grep -q "guitarra/microfone"
          ARCHS="$(lipo -archs "$EXE")"
          echo "Arquiteturas: $ARCHS"
          grep -qw arm64 <<<"$ARCHS"
          grep -qw x86_64 <<<"$ARCHS"
          otool -L "$EXE"
          codesign -dvvv "$APP" 2>&1 || true
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true

      - name: Criar piano sintetico para o teste
        run: |
          SAMPLE_DIR=build-mac/MinhaDAW_artefacts/Release/Library/01.\ Pianos/Black\ Upright
          mkdir -p "$SAMPLE_DIR"
          SAMPLE_DIR="$SAMPLE_DIR" python3 - <<'PY'
          import math
          import os
          import struct
          import wave

          rate = 48000
          duration = 12
          frames = rate * duration
          path = os.path.join(os.environ["SAMPLE_DIR"], "C3.wav")

          with wave.open(path, "wb") as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(rate)
              chunk = bytearray()

              for i in range(frames):
                  t = i / rate
                  fade_in = min(1.0, i / (rate * 0.04))
                  fade_out = min(1.0, (frames - i) / (rate * 0.08))
                  envelope = fade_in * fade_out * math.exp(-t * 0.055)
                  sample = int(32767 * 0.045 * envelope * (
                      math.sin(2 * math.pi * 130.8128 * t)
                      + 0.30 * math.sin(2 * math.pi * 261.6256 * t)
                      + 0.12 * math.sin(2 * math.pi * 392.4384 * t)))
                  packed = struct.pack("<hh", sample, sample)
                  chunk.extend(packed)

                  if len(chunk) >= 65536:
                      wav.writeframesraw(chunk)
                      chunk.clear()

              if chunk:
                  wav.writeframesraw(chunk)
          PY

      - name: Testar audio e MIDI dentro do app
        run: |
          APP=build-mac/MinhaDAW_artefacts/Release/ChurchDAW.app
          EXE="$APP/Contents/MacOS/ChurchDAW"
          mkdir -p prints
          CHURCHDAW_SELFTEST=worship CHURCHDAW_SELFTEST_QUIT_SECONDS=22 \
            "$EXE" >mac-selftest.log 2>&1 &
          PID=$!

          cleanup() {
            if [[ -n "${PID:-}" ]]; then
              kill "$PID" >/dev/null 2>&1 || true
              wait "$PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          previous=0
          for current in 5 12 20; do
            sleep $(( current - previous ))
            previous=$current
            kill -0 "$PID" || { echo "APP CRASHOU"; cat mac-selftest.log; exit 1; }
            screencapture -x "prints/tela_${current}s.png" || true
          done

          for unused in {1..10}; do
            kill -0 "$PID" >/dev/null 2>&1 || break
            sleep 1
          done
          kill -0 "$PID" >/dev/null 2>&1 && { echo "APP NAO ENCERROU LIMPO"; exit 1; }
          wait "$PID"
          PID=
          trap - EXIT

          cat mac-selftest.log
          grep -q "AUDIO: TESTE WORSHIP SUAVE LIGADO" mac-selftest.log
          grep -q "AUDIO: teste carregando canal 1 = Black Upright" mac-selftest.log
          grep -q "BIBLIOTECA: timbre Black Upright pronto" mac-selftest.log
          grep -Eq "MAC_SELFTEST: blocks [0-9]+ audible [1-9][0-9]*" mac-selftest.log
          ! grep -Eq "MAC_SELFTEST:.*invalid [1-9][0-9]*" mac-selftest.log
          echo "APP RODANDO, MIDI GERADO E AUDIO NA SAIDA"

      - name: Testar salvamento e restauracao
        run: |
          APP=build-mac/MinhaDAW_artefacts/Release/ChurchDAW.app
          EXE="$APP/Contents/MacOS/ChurchDAW"
          SETTINGS_DIR="$HOME/Library/Application Support/ChurchDAW"
          find "$SETTINGS_DIR" -maxdepth 1 -type f -print
          test -n "$(find "$SETTINGS_DIR" -maxdepth 1 -type f -size +0c -print -quit)"

          CHURCHDAW_SELFTEST=restore CHURCHDAW_SELFTEST_QUIT_SECONDS=7 \
            "$EXE" >mac-restore.log 2>&1 &
          PID=$!

          for unused in {1..12}; do
            kill -0 "$PID" >/dev/null 2>&1 || break
            sleep 1
          done
          kill -0 "$PID" >/dev/null 2>&1 && { kill "$PID"; echo "REABERTURA NAO ENCERROU"; exit 1; }
          wait "$PID"

          cat mac-restore.log
          grep -q "AUDIO: TESTE RESTAURACAO LIGADO" mac-restore.log
          grep -q "BIBLIOTECA: timbre Black Upright pronto" mac-restore.log
          grep -Eq "MAC_SELFTEST: blocks [0-9]+ audible [1-9][0-9]*" mac-restore.log
          ! grep -Eq "MAC_SELFTEST:.*invalid [1-9][0-9]*" mac-restore.log
          echo "ESTADO SALVO E RESTAURADO COM AUDIO"

      - name: Testar hot-plug e notas CoreMIDI
        run: |
          APP=build-mac/MinhaDAW_artefacts/Release/ChurchDAW.app
          EXE="$APP/Contents/MacOS/ChurchDAW"
          clang++ -std=c++17 Tests/mac_midi_source.cpp \
            -framework CoreMIDI -framework CoreFoundation -o mac-midi-source

          CHURCHDAW_SELFTEST=external CHURCHDAW_SELFTEST_QUIT_SECONDS=16 \
            "$EXE" >mac-external-midi.log 2>&1 &
          APP_PID=$!
          sleep 3
          ./mac-midi-source >mac-midi-helper.log 2>&1 &
          MIDI_PID=$!
          sleep 6
          kill -0 "$APP_PID"
          kill -0 "$MIDI_PID"
          screencapture -x prints/tela_midi_externo.png || true
          wait "$MIDI_PID"

          for unused in {1..10}; do
            kill -0 "$APP_PID" >/dev/null 2>&1 || break
            sleep 1
          done
          kill -0 "$APP_PID" >/dev/null 2>&1 && { kill "$APP_PID"; echo "APP NAO ENCERROU"; exit 1; }
          wait "$APP_PID"

          cat mac-midi-helper.log
          cat mac-external-midi.log
          grep -q "MIDI_HELPER_READY" mac-midi-helper.log
          grep -q "AUDIO: TESTE MIDI EXTERNO LIGADO" mac-external-midi.log
          grep -Eq "MIDI: [1-9][0-9]* entrada\\(s\\)" mac-external-midi.log
          grep -Eq "MAC_SELFTEST: blocks [0-9]+ audible [1-9][0-9]*" mac-external-midi.log
          ! grep -Eq "MAC_SELFTEST:.*invalid [1-9][0-9]*" mac-external-midi.log
          echo "HOT-PLUG COREMIDI E NOTAS EXTERNAS OK"

      - name: Publicar diagnostico de audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-audio-macos
          path: |
            mac-selftest.log
            mac-restore.log
            mac-external-midi.log
            mac-midi-helper.log

      - name: Teste visual do app
        run: |
          test -s prints/tela_5s.png
          test -s prints/tela_12s.png
          test -s prints/tela_20s.png
          test -s prints/tela_midi_externo.png
          echo "PRINTS DO APP OK"

      - name: Publicar prints do app rodando no Mac
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-macos
          path: prints/

      - name: Gerar instalador .dmg
        run: |
          APP=build-mac/MinhaDAW_artefacts/Release/ChurchDAW.app
          mkdir dmg-root
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "ChurchDAW" -srcfolder dmg-root -ov -format UDZO ChurchDAW.dmg

      - name: Validar instalador .dmg
        run: |
          MOUNT="$(mktemp -d)"
          hdiutil attach ChurchDAW.dmg -readonly -nobrowse -mountpoint "$MOUNT"
          test -d "$MOUNT/ChurchDAW.app"
          test -L "$MOUNT/Applications"
          /usr/bin/codesign -dvv "$MOUNT/ChurchDAW.app" 2>&1 || true
          hdiutil detach "$MOUNT"

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ChurchDAW-macOS
          path: ChurchDAW.dmg
