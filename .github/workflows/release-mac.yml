name: Release comercial macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag imutavel no formato vMAJOR.MINOR.PATCH
        required: true
        type: string
      confirmation:
        description: Confirme que esta e uma release comercial
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - RELEASE

permissions:
  contents: read

concurrency:
  # Uma unica release comercial macOS pode usar o certificado/notario por vez,
  # inclusive quando tags diferentes forem despachadas quase simultaneamente.
  group: churchdaw-macos-commercial-release
  cancel-in-progress: false

jobs:
  release-macos:
    if: inputs.confirmation == 'RELEASE'
    name: Assinar, notarizar e verificar
    runs-on: macos-14
    timeout-minutes: 120
    environment: macos-production
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPECTED_BUNDLE_ID: com.churchdaw.app
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      RELEASE_OUTPUT_ROOT: release-macos

    steps:
      - name: Validar entrada antes do checkout
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Tag invalida: $RELEASE_TAG" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] \
            || { echo "Despache o workflow a partir da tag informada" >&2; exit 1; }

      - name: Baixar exatamente a tag solicitada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Provar tag, commit e ancestralidade em origin/main
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Tag invalida: $RELEASE_TAG" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] \
            || { echo "Despache o workflow a partir da tag informada" >&2; exit 1; }

          head_commit="$(git rev-parse --verify HEAD)"
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          [[ "$head_commit" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$tag_commit" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$head_commit" == "$GITHUB_SHA" ]] \
            || { echo "HEAD diverge de GITHUB_SHA" >&2; exit 1; }
          [[ "$head_commit" == "$tag_commit" ]] \
            || { echo "HEAD diverge da tag local" >&2; exit 1; }

          main_commit="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          [[ "$main_commit" =~ ^[0-9a-fA-F]{40}$ ]]
          git merge-base --is-ancestor "$head_commit" "$main_commit" \
            || { echo "A tag nao pertence ao historico de origin/main" >&2; exit 1; }

          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] \
            || { echo "Checkout nao esta limpo" >&2; exit 1; }

      - name: Testar rejeicao de instaladores macOS incompletos
        run: python3 Tests/DesktopUpdate/MacReleasePipelineTests.py

      - name: Construir, assinar e notarizar sem atalhos
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_EXPECTED_TEAM_ID: ${{ vars.MACOS_EXPECTED_TEAM_ID }}
          MACOS_EXPECTED_CERTIFICATE_SHA256: ${{ vars.MACOS_EXPECTED_CERTIFICATE_SHA256 }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash Packaging/MacRelease/release-macos.sh

      - name: Revalidar tag e main remotas antes de qualquer upload
        id: provenance_recheck
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo "github.token ausente" >&2; exit 1; }
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          endpoint="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          remote_row="$(
            gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$endpoint" \
              --jq '[.ref, .object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r remote_ref remote_type remote_sha <<<"$remote_row"
          [[ "$remote_ref" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$remote_sha" =~ ^[0-9a-fA-F]{40}$ ]]

          local_ref_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG")"
          [[ "$local_ref_sha" == "$remote_sha" ]] \
            || { echo "O objeto remoto da tag mudou" >&2; exit 1; }

          seen=""
          depth=0
          while [[ "$remote_type" == "tag" ]]; do
            (( depth < 8 )) || { echo "Cadeia de tags profunda demais" >&2; exit 1; }
            [[ " $seen " != *" $remote_sha "* ]] \
              || { echo "Ciclo na cadeia de tags" >&2; exit 1; }
            seen="$seen $remote_sha"
            remote_row="$(
              gh api --method GET \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "repos/$GITHUB_REPOSITORY/git/tags/$remote_sha" \
                --jq '[.object.type, .object.sha] | @tsv'
            )"
            IFS=$'\t' read -r remote_type remote_sha <<<"$remote_row"
            [[ "$remote_sha" =~ ^[0-9a-fA-F]{40}$ ]]
            (( depth += 1 ))
          done

          [[ "$remote_type" == "commit" ]] \
            || { echo "A tag nao termina em commit" >&2; exit 1; }
          head_commit="$(git rev-parse --verify HEAD)"
          [[ "$remote_sha" == "$head_commit" ]]
          [[ "$remote_sha" == "$GITHUB_SHA" ]]

          main_row="$(
            gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              --jq '[.ref, .object.type, .object.sha] | @tsv'
          )"
          IFS=$'\t' read -r main_ref main_type main_sha <<<"$main_row"
          [[ "$main_ref" == "refs/heads/main" ]]
          [[ "$main_type" == "commit" ]]
          [[ "$main_sha" =~ ^[0-9a-fA-F]{40}$ ]]

          compare_status="$(
            gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/compare/$head_commit...$main_sha" \
              --jq '.status'
          )"
          [[ "$compare_status" == "identical" || "$compare_status" == "ahead" ]] \
            || { echo "A tag nao pertence mais ao historico de main" >&2; exit 1; }

          printf 'validated=true\n' >>"$GITHUB_OUTPUT"
          echo "Tag remota $remote_sha confirmada em main $main_sha"

      - name: Publicar logs de auditoria
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChurchDAW-macOS-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-macos/logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar candidato comercial notarizado
        if: success() && steps.provenance_recheck.outputs.validated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChurchDAW-macOS-${{ env.RELEASE_TAG }}-notarized
          path: release-macos/artifacts/
          if-no-files-found: error
          retention-days: 30
