workflows:
  churchdaw-ios-ipados:
    name: ChurchDAW — iPad & iPhone (Device IPA + Simulator)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Exibir ambiente Xcode e SDKs
        script: |
          set -euo pipefail
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Configurar CMake para iOS / iPadOS
        script: |
          set -euo pipefail
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON

      - name: Compilar ChurchDAW arm64 para iPad e iPhone fisicos (sem assinatura)
        script: |
          set -euo pipefail
          cmake --build build-ios \
            --config Release \
            --target MinhaDAW \
            --parallel 4 \
            -- \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          DEVICE_APP="$(find build-ios -path '*Release-iphoneos*' -type d -name ChurchDAW.app -print -quit)"
          if [[ -z "$DEVICE_APP" ]]; then
            DEVICE_APP="$(find build-ios -type d -name ChurchDAW.app -print -quit)"
          fi
          test -n "$DEVICE_APP"
          python3 Tests/Studio/ValidateIOSBundle.py "$DEVICE_APP"

          mkdir -p dist-ios Payload
          rm -rf Payload/ChurchDAW.app
          cp -R "$DEVICE_APP" Payload/ChurchDAW.app
          ditto -c -k --sequesterRsrc --keepParent Payload dist-ios/ChurchDAW-iPad-iPhone-Device-arm64.ipa
          rm -rf Payload

      - name: Compilar e validar pacote para Simulador iPhone / iPad
        script: |
          set -euo pipefail
          cmake --build build-ios \
            --config Release \
            --target MinhaDAW \
            --parallel 4 \
            -- \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          SIM_APP="$(find build-ios -path '*Release-iphonesimulator*' -type d -name ChurchDAW.app -print -quit)"
          if [[ -z "$SIM_APP" ]]; then
            SIM_APP="$(find build-ios -type d -name ChurchDAW.app -print -quit)"
          fi
          test -n "$SIM_APP"
          plutil -lint "$SIM_APP/Info.plist"
          python3 Tests/Studio/ValidateIOSBundle.py "$SIM_APP"

          while IFS= read -r ENTITLEMENTS; do
            if grep -Eq 'com\.apple\.security\.(device\.audio-input|cs\.disable-library-validation)' "$ENTITLEMENTS"; then
              echo "Entitlement exclusivo de macOS vazou para o iOS: $ENTITLEMENTS" >&2
              exit 1
            fi
          done < <(find build-ios -type f -name '*.entitlements' -print)

          mkdir -p dist-ios
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" dist-ios/ChurchDAW-iPad-iPhone-Simulator.zip
    artifacts:
      - dist-ios/*.ipa
      - dist-ios/*.zip

  churchdaw-macos:
    name: ChurchDAW — macOS Universal (arm64 + Intel DMG)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Configurar e compilar ChurchDAW Universal (arm64 + x86_64)
        script: |
          set -euo pipefail
          cmake -B build-mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHURCHDAW_ENABLE_DESKTOP_LICENSING=OFF \
            -DCHURCHDAW_ALLOW_UNLICENSED_DESKTOP_BUILD=ON \
            -DCHURCHDAW_BUILD_LICENSE_TESTS=OFF \
            -DCHURCHDAW_BUILD_AUDIO_TESTS=ON \
            -DCHURCHDAW_UPDATE_REQUIRE_OS_SIGNATURE=OFF
          cmake --build build-mac --config Release --parallel 4

      - name: Rodar suites CTest de DSP, MIDI e Layout no macOS
        script: |
          set -euo pipefail
          ctest --test-dir build-mac -C Release --output-on-failure -j 4

      - name: Assinar ad-hoc, auditar arquiteturas e gerar DMG Universal
        script: |
          set -euo pipefail
          APP="build-mac/MinhaDAW_artefacts/Release/ChurchDAW.app"
          EXE="$APP/Contents/MacOS/ChurchDAW"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          plutil -lint "$PLIST"

          ARCHS="$(lipo -archs "$EXE")"
          echo "Arquiteturas no binario macOS: $ARCHS"
          grep -qw arm64 <<<"$ARCHS"
          grep -qw x86_64 <<<"$ARCHS"

          codesign --force --deep --sign - --options runtime \
            --entitlements Packaging/ChurchDAW.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          mkdir -p dist-mac dmg-stage
          cp -R "$APP" dmg-stage/ChurchDAW.app
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "ChurchDAW $VERSION" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "dist-mac/ChurchDAW-${VERSION}-macOS-Universal.dmg"
          rm -rf dmg-stage
    artifacts:
      - dist-mac/*.dmg

  # Manual (sem "triggering"): mede no Mac M2 o que o Windows/Android nao preveem.
  # Nao publica nada e nao altera o fluxo de release acima.
  churchdaw-macos-medicao:
    name: ChurchDAW — medicao no Mac M2 (Pad original x otimizado + capturas do desktop)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Configurar
        script: |
          set -euo pipefail
          cmake -B build-mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHURCHDAW_ENABLE_DESKTOP_LICENSING=OFF \
            -DCHURCHDAW_ALLOW_UNLICENSED_DESKTOP_BUILD=ON \
            -DCHURCHDAW_BUILD_LICENSE_TESTS=OFF \
            -DCHURCHDAW_BUILD_AUDIO_TESTS=ON \
            -DCHURCHDAW_UPDATE_REQUIRE_OS_SIGNATURE=OFF
          mkdir -p dist-mac/medicao
          { sysctl -n machdep.cpu.brand_string; sw_vers; sysctl hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu; } > dist-mac/medicao/maquina.txt 2>&1 || true

      - name: Compilar a sonda do Pad
        ignore_failure: true
        script: |
          set -euo pipefail
          cmake --build build-mac --config Release --parallel 4 --target ChurchDAWPadSynthRenderProbe

      - name: Pad no Mac M2 - original (2bd4ebb) x otimizado, alternando
        ignore_failure: true
        script: |
          set -euo pipefail
          PROBE="$(find build-mac -type f -name ChurchDAWPadSynthRenderProbe -perm -u+x -print -quit)"
          test -n "$PROBE"
          BASE=Tests/Audio/Baselines/padsynth-v1-48k.cdpcap
          cp "$PROBE" /tmp/probe-novo
          git cat-file -e "2bd4ebb^{commit}" 2>/dev/null || git fetch --unshallow --quiet
          cp Source/PadSynthProcessor.h /tmp/PadSynthProcessor.novo.h
          git show 2bd4ebb:Source/PadSynthProcessor.h > Source/PadSynthProcessor.h
          cmake --build build-mac --config Release --parallel 4 --target ChurchDAWPadSynthRenderProbe
          cp "$PROBE" /tmp/probe-original
          cp /tmp/PadSynthProcessor.novo.h Source/PadSynthProcessor.h
          for i in 1 2 3 4; do
            for v in original novo; do
              echo "$v rodada $i: $(/tmp/probe-$v --self-test --repetitions 5 --baseline "$BASE" 2>&1 | grep -E 'PAD_SYNTH_TIMING|_OK|FAIL|mismatch' | tr '\n' ' ')"
            done
          done | tee dist-mac/medicao/pad-ab-mac.txt

      - name: Compilar a previa de design do desktop
        ignore_failure: true
        script: |
          set -euo pipefail
          cmake --build build-mac --config Release --parallel 4 --target ChurchDAWDesktopDesignPreview

      - name: Testes de tela e capturas do desktop no Mac (previa isolada)
        ignore_failure: true
        script: |
          set -euo pipefail
          APPBIN="$(find build-mac -type f -path '*ChurchDAW Design Preview.app/Contents/MacOS/*' -print -quit)"
          test -n "$APPBIN"
          FIX="$(mktemp -d)"
          mkdir "$FIX/settings" "$FIX/data" "$FIX/caps" "$FIX/caps-cenas"
          printf 'churchdaw-design-preview-v1' > "$FIX/.churchdaw-design-preview"
          export CHURCHDAW_QA_SETTINGS_DIR="$FIX/settings" CHURCHDAW_QA_DATA_DIR="$FIX/data"
          run() { perl -e 'alarm shift; exec @ARGV' 300 "$APPBIN" "$@"; }
          run --test-shell 2>&1 | tail -8 | tee dist-mac/medicao/test-shell-mac.txt || true
          run --size=1600x900 --showcase --capture-dir "$FIX/caps" || true
          run --size=1600x900 --surface scenes --capture-dir "$FIX/caps-cenas" || true
          cp -R "$FIX/caps" dist-mac/medicao/caps-desktop || true
          cp -R "$FIX/caps-cenas" dist-mac/medicao/caps-cenas || true

      - name: Compilar a previa mobile (layout do iPad e do iPhone)
        ignore_failure: true
        script: |
          set -euo pipefail
          cmake --build build-mac --config Release --parallel 4 --target ChurchDAWMobileDesignPreview

      - name: Capturas do layout iPad/iPhone no Mac (9 telas por tamanho)
        ignore_failure: true
        script: |
          set -euo pipefail
          APPBIN="$(find build-mac -type f -path '*ChurchDAW Mobile Preview.app/Contents/MacOS/*' -print -quit)"
          test -n "$APPBIN"
          FIX="$(mktemp -d)"
          mkdir "$FIX/settings" "$FIX/data"
          printf 'churchdaw-design-preview-v1' > "$FIX/.churchdaw-design-preview"
          export CHURCHDAW_QA_SETTINGS_DIR="$FIX/settings" CHURCHDAW_QA_DATA_DIR="$FIX/data"
          for SZ in 1366x1024 1080x810 1180x820 926x428; do
            mkdir "$FIX/mobile-$SZ"
            perl -e 'alarm shift; exec @ARGV' 300 "$APPBIN" --size="$SZ" --capture-all --capture-dir "$FIX/mobile-$SZ" || true
            cp -R "$FIX/mobile-$SZ" "dist-mac/medicao/mobile-$SZ" || true
          done
    artifacts:
      - dist-mac/medicao/*
      - dist-mac/medicao/**/*.png
